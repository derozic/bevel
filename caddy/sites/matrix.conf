# Production Caddy block — append to /etc/caddy/Caddyfile on bevel-prod
# then: caddy validate && caddy reload (NEVER pkill caddy).
#
# Client-Server API only on this cheap deploy (no :8448 federation yet).

matrix.bevel.is {
	import common_headers
	encode gzip
	reverse_proxy 127.0.0.1:8008 {
		header_up X-Forwarded-Proto {scheme}
		header_up X-Forwarded-Host {host}
		header_up X-Real-IP {remote_host}
	}
	log {
		output file /var/log/caddy/matrix_bevel_is.log {
			roll_size 10MB
			roll_keep 3
		}
		format json
	}
}

# Optional well-known for clients that look at the parent domain
# (only if you want Element to discover the HS via bevel.is — otherwise clients
# use matrix.bevel.is directly).
