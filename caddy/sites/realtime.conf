# BEVEL realtime (WebSocket) — port 43208
realtime.bevel.lvh.me {
	encode zstd gzip
	reverse_proxy 127.0.0.1:43208 {
		flush_interval -1
	}
	log {
		output file {$HOME}/dev/logs/bevel-realtime.log
		format console
	}
}

