tenant: decli
name: Decli
domain: bevel.decli.dev
hosts:
  - bevel.decli.dev
  - bevel.decli.lvh.me
  - decli.bevel.lvh.me

plan: pro
feature_access: beta

brand:
  theme: ./theme.json
  product_name: Decli
  cmyk:
    kit_id: decli

features:
  async_streams: true
  live_sessions: true
  analytics: true
  channels: true
  direct_messages: true
  agent_dispatch: true
  work_mode: true
  custom_branding: true

auth:
  mode: google
  # Closed membership — exact emails only (no broad domain grab)
  # Roster: tenants/memberships.yaml
  allowed_emails: []


realtime:
  namespace: decli
  presence: true
  url: https://realtime.bevel.lvh.me

transports:
  asyncStream:
    kind: async-stream
    protocol: sse
  liveBidirectional:
    kind: live-bidirectional
    protocol: websocket

deployment:
  preview_url: https://bevel.decli.lvh.me
  production_url: https://bevel.decli.dev
  target: custom
