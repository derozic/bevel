tenant: demo
name: BEVEL Demo
domain: demo.2x4m.cc
hosts:
  - demo.2x4m.cc
  - demo.2x4m.lvh.me

brand:
  theme: ./theme.json
  product_name: BEVEL
  logo: ./logo.svg

plan: pro
feature_access: beta

features:
  async_streams: true
  live_sessions: true
  analytics: true
  channels: true
  direct_messages: true
  agent_dispatch: true
  work_mode: true
  custom_branding: true

auth:
  mode: google
  allowed_domains:
    - 2x4m.cc
    - derozic.com
  allowed_emails:
    - scott@derozic.com
    - s@derozic.com
    - twobyform@gmail.com

realtime:
  namespace: demo
  presence: true

transports:
  asyncStream:
    kind: async-stream
    protocol: sse
  liveBidirectional:
    kind: live-bidirectional
    protocol: websocket

deployment:
  preview_url: https://demo.2x4m.lvh.me
  production_url: https://demo.2x4m.cc
  target: custom

work_repos:
  - derozic/bevel
