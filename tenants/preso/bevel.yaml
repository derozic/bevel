tenant: preso
name: Preso
domain: bevel.pres0.com
hosts:
  - bevel.pres0.com
  - bevel.preso.lvh.me
  - agents.preso.lvh.me
  - preso.bevel.lvh.me

plan: pro
feature_access: beta

brand:
  theme: ./theme.json
  product_name: Preso
  cmyk:
    kit_id: preso

features:
  async_streams: true
  live_sessions: true
  analytics: true
  channels: true
  direct_messages: true
  agent_dispatch: true
  work_mode: true
  custom_branding: true

auth:
  mode: google
  # Roster: tenants/memberships.yaml
  allowed_emails: []


realtime:
  namespace: preso
  presence: true
  url: https://realtime.bevel.lvh.me

transports:
  asyncStream:
    kind: async-stream
    protocol: sse
  liveBidirectional:
    kind: live-bidirectional
    protocol: websocket

deployment:
  preview_url: https://bevel.preso.lvh.me
  production_url: https://bevel.pres0.com
  target: custom

work_repos:
  - derozic/preso2x4m
